{{- if and .Values.aodbApi.s3.enabled .Values.aodbApi.s3.externalSecret.enabled }}
{{- $remoteKey := required "aodbApi.s3.externalSecret.secretName is required when externalSecret.enabled is true" .Values.aodbApi.s3.externalSecret.secretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-s3-creds
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ default "1h" .Values.aodbApi.externalSecret.secretRefreshInterval }}
  secretStoreRef:
    name: {{ default "gcp-clusterstore" .Values.aodbApi.externalSecret.secretStoreName }}
    kind: {{ default "ClusterSecretStore" .Values.aodbApi.externalSecret.secretStoreKind }}
  target:
    name: {{ .Values.aodbApi.s3.credentialsSecret | default (printf "%s-s3-creds" .Release.Name) }}
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: {{ $remoteKey }}
        property: access_key
        decodingStrategy: Base64
    - secretKey: secret-access-key
      remoteRef:
        key: {{ $remoteKey }}
        property: secret_key
        decodingStrategy: Base64
{{- end }}
