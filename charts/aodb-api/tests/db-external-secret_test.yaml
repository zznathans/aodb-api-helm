suite: db external secret
templates:
  - db-external-secret.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: creates an ExternalSecret when createSecret is false
    set:
      aodbApi.db.createSecret: false
      aodbApi.externalSecret.gcpSecretName: my-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
