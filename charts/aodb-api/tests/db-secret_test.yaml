suite: db secret
templates:
  - db-secret.yaml
tests:
  - it: creates a plain Secret by default
    set:
      aodbApi.db.password: testpass
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: renders nothing when createSecret is false
    set:
      aodbApi.db.createSecret: false
    asserts:
      - hasDocuments:
          count: 0
