suite: s3 credentials external secret
templates:
  - s3-credentials-external-secret.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when s3 is enabled but externalSecret is not
    set:
      aodbApi.s3.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ExternalSecret when both s3 and its externalSecret are enabled
    set:
      aodbApi.s3.enabled: true
      aodbApi.s3.externalSecret.enabled: true
      aodbApi.s3.externalSecret.secretName: my-r2-creds
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-s3-creds
