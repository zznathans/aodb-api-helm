name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yaml .

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: "3.17.0"
      - name: Add mariadb-operator repo
        run: helm repo add mariadb-operator https://mariadb-operator.github.io/mariadb-operator
      - name: Build chart dependencies
        run: helm dependency build charts/aodb-api
      - name: Run helm lint
        run: helm lint charts/aodb-api --strict --set aodbApi.db.password=lint-placeholder

  helm-unittest:
    name: Helm Unit Tests
    needs: [helm-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: "3.17.0"
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.2
      - name: Add mariadb-operator repo
        run: helm repo add mariadb-operator https://mariadb-operator.github.io/mariadb-operator
      - name: Build chart dependencies
        run: helm dependency build charts/aodb-api
      - name: Run helm unit tests
        run: helm unittest charts/aodb-api
